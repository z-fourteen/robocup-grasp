name: P0-A baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.10.12 / Open3D 0.19
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/lock.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements/lock.txt

      - name: Install project without dependency re-resolution
        run: python -m pip install --no-deps --no-build-isolation --editable .

      - name: Run test suite
        run: python -m pytest -q

      - name: Validate committed example sequence
        run: python -m robot_grasp validate-sequence --input examples/minimal_sequence
