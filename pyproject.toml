[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robocup-robot-grasp"
version = "0.1.0"
description = "RGB-D object reconstruction and grasp-pose utilities for RoboCup"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.10",
  "numpy>=1.24",
  "Pillow>=9.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
open3d = ["open3d>=0.17"]
dev = ["pytest>=7"]

[project.scripts]
robot-grasp = "robot_grasp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_grasp = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:launch_testing -p no:launch_ros"
